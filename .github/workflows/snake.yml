name: Gerar visuais do perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar cards sem marca d'água
        env:
          BASE: https://www.gitskins.com/api/section
          COMMON: username=joaoanisio&theme=github-dark&avatar=https%3A%2F%2Favatars.githubusercontent.com%2Fu%2F164044153%3Fu%3Da8ae0ab8f0bc480d1e74a3e0f704bd44a937da79%26v%3D4
        run: |
          mkdir -p dist
          # save <arquivo> <url>
          save() {
            curl -fsSL "$2" -o "$1"
            if ! grep -q '<svg' "$1" || grep -q 'section unavailable' "$1"; then
              echo "Card $1 inválido" >&2
              exit 1
            fi
            if grep -q 'Unlock this template' "$1"; then
              echo "Card $1 usa um modelo pago do GitSkins" >&2
              exit 1
            fi
            sed -i -E -e 's#<text[^>]*>gitskins\.com</text>##g' -e 's#aria-label="GitSkins #aria-label="#' "$1"
          }
          # fetch <nome> <seção> <parâmetros extras>
          fetch() {
            for mode in dark light; do
              save "dist/card-$1-$mode.svg" "$BASE/$2?$COMMON&$3&mode=$mode"
            done
          }
          fetch hero hero "label=joaoanisio"
          fetch projects projects "repos=joaoanisio%2Ffast-api-cars%2Cjoaoanisio%2Fn8n-whatsapp-ai-agent%2Cjoaoanisio%2Fjob-application-tracker%2Cjoaoanisio%2Fcrypto-portfolio-analytics"
          fetch stack stack ""
          fetch heatmap heatmap ""

      - name: Traduzir cards para português
        run: |
          cat > traducao.sed <<'EOF'
          s#>Building with ([^<]+) on GitHub\.<#>Construindo com \1 no GitHub.<#g
          s#>TOTAL STARS<#>ESTRELAS NO TOTAL<#g
          s#>1 projects?<#>1 projeto<#g
          s#>([0-9]+) projects<#>\1 projetos<#g
          s#>No description provided\.<#>Sem descrição.<#g
          s#>updated today<#>atualizado hoje<#g
          s#>updated 1d ago<#>atualizado há 1 dia<#g
          s#>updated ([0-9]+)d ago<#>atualizado há \1 dias<#g
          s#>updated 1w ago<#>atualizado há 1 semana<#g
          s#>updated ([0-9]+)w ago<#>atualizado há \1 semanas<#g
          s#>updated 1mo ago<#>atualizado há 1 mês<#g
          s#>updated ([0-9]+)mo ago<#>atualizado há \1 meses<#g
          s#>updated 1y ago<#>atualizado há 1 ano<#g
          s#>updated ([0-9]+)y ago<#>atualizado há \1 anos<#g
          s#>Language Stack<#>Linguagens<#g
          s#>Repository-weighted technologies<#>Tecnologias por peso nos repositórios<#g
          s#>Contribution Activity<#>Atividade de contribuições<#g
          s#>([0-9]+) contributions in the last year<#>\1 contribuições no último ano<#g
          s#>Less<#>Menos<#g
          s#>More<#>Mais<#g
          EOF
          sed -i -E -f traducao.sed dist/*.svg

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
